# One changelog for every checklist, newest first. Every checklist page shows the same 5 newest entries
# in the "recent changes" box; changelog.html / changelog-en.html list them all. Each entry starts with
# a pill per platform it applies to (icon and `platform` from `checklists` in _config.yml).
#
# Fields:
#   date       YYYY-MM-DD
#   type       added | changed | fixed | removed
#   platforms  optional: the checklists it applies to, by folder: [app-store], [google-play] or both;
#              leave it out when it applies to every checklist (site-wide changes)
#   vi, en     one line each (inline markdown allowed)
#   anchor     optional, entries with one platform only: heading id of the changed section on that
#              checklist's page in each language, copied from the live page
#              (e.g. 6-quyền-riêng-tư-và-pháp-lý / 6-privacy-and-legal); update it if the heading is renamed
#
# Example:
# - date: 2026-12-01
#   type: added
#   platforms: [app-store]
#   vi: Thêm bước App Compliance khi bán ở Trung Quốc đại lục
#   en: Add the App Compliance step for China mainland
#   anchor:
#     vi: 6-quyền-riêng-tư-và-pháp-lý
#     en: 6-privacy-and-legal

- date: 2026-11-25
  type: added
  platforms: [google-play]
  vi: Thêm các lý do bị từ chối hay gặp, xoá tài khoản chi tiết (trong app và link web), quyền do thư viện tự thêm, quyền ảnh/video, subscription, chính sách metadata
  en: Add the most common rejection reasons, account deletion in detail (in the app and a web link), permissions added by libraries, photo and video permissions, subscriptions, the metadata policy
  anchor:
    vi: 6-quyền-riêng-tư-và-chính-sách
    en: 6-privacy-and-policy

- date: 2026-11-25
  type: added
  platforms: [app-store]
  vi: Thêm các lý do bị từ chối hay gặp, xoá tài khoản chi tiết, đăng nhập theo guideline 4.8 hiện tại (Sign in with Apple hoặc cách tương đương), quyền, ATT, subscription, iPad, nhắc tên nền tảng khác
  en: Add the most common rejection reasons, account deletion in detail, sign-in under the current guideline 4.8 (Sign in with Apple or an equal option), permissions, ATT, subscriptions, iPad, mentions of other platforms
  anchor:
    vi: 6-quyền-riêng-tư-và-pháp-lý
    en: 6-privacy-and-legal

- date: 2026-11-25
  type: added
  platforms: [app-store]
  vi: Thêm mục CallKit khi app bán ở Trung Quốc đại lục (bị từ chối theo guideline 5) vào phần pháp lý và các bẫy cần tránh
  en: Add the CallKit item for apps on sale in China mainland (rejected under guideline 5) to the legal section and the traps
  anchor:
    vi: 6-quyền-riêng-tư-và-pháp-lý
    en: 6-privacy-and-legal

