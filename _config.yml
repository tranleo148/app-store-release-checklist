title: Mobile release checklists
description: Checklists for a first App Store (iOS) and Google Play (Android) release, in Vietnamese and English.
lang: vi
# Author credit shown in the footer of every page (the license is CC BY 4.0, see LICENSE)
author:
  name: Leo Tran
  url: https://github.com/tranleo148
# One folder per checklist: <slug>/index.md (Vietnamese) and <slug>/en.md (English).
# In this order they make the tabs under the toolbar (the first one is the site's home); the slug also
# finds checklist pages (download button, recent-changes box), names downloads and tags changelog entries.
# A new checklist also gets an icon in _includes/checklist-icon.html.
checklists:
  - slug: app-store
    name: App Store
  - slug: google-play
    name: Google Play
plugins:
  - jekyll-seo-tag
# Repo-only files, not pages of the site
exclude:
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - LICENSE
  - LICENSE-CODE
